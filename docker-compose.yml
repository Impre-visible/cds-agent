# Déploiement du daemon en conteneur :
#
#   docker compose up -d --build
#
# Ce que ça donne : le daemon redémarre tout seul après un crash et au
# redémarrage de la machine (restart: unless-stopped — sur macOS, il faut en
# plus que Docker Desktop soit réglé pour se lancer à l'ouverture de session).
#
# Ce fichier ne démarre QUE le daemon. L'instance OpenHands, à qui il délègue
# tout le travail, a son propre compose :
#
#   docker compose --env-file .env -f docker/openhands/docker-compose.yml up -d
#
# Deux fichiers plutôt qu'un, délibérément : le daemon et OpenHands ont des
# cycles de vie différents (on redémarre le daemon en développant, pas
# l'instance et son volume d'état), et OpenHands doit pouvoir tourner seul le
# temps de le régler à la main dans son interface. Le réseau `cds-agent-net`,
# créé ici, est ce qui les relie — l'autre compose le déclare `external`.
#
# ---------------------------------------------------------------------------
# CE QUI A DISPARU DE CE FICHIER (et où c'est parti)
# ---------------------------------------------------------------------------
#
# Ce service ne monte PLUS /var/run/docker.sock, et n'a plus besoin de
# CDS_WORK_DIR ni de l'identité de chemin hôte ↔ conteneur : le daemon ne
# lance plus aucun conteneur et ne crée plus aucun espace de travail. Il n'y a
# plus non plus de proxy d'inférence à rendre joignable, puisqu'il ne parle
# plus à un serveur de modèle.
#
# Ce n'est PAS un gain net de sécurité pour le déploiement : l'accès au socket
# docker — équivalent à root sur la machine — a simplement changé de mains. Il
# est maintenant détenu par le conteneur OpenHands, qui crée les bacs à sable,
# et qui détient AUSSI le jeton GitLab en écriture. Voir docs/openhands.md.

name: cds-agent

services:
  daemon:
    build:
      context: .
      dockerfile: docker/daemon.Dockerfile
    image: cds-agent/daemon
    container_name: cds-agent-daemon
    restart: unless-stopped

    # Toute la configuration du daemon vient de .env, exactement comme en
    # lancement depuis un terminal. .env n'entre jamais dans l'image (voir
    # .dockerignore) : il est lu ici, à l'exécution.
    env_file: .env

    environment:
      # L'instance OpenHands se joint par son NOM de conteneur sur le réseau
      # partagé, pas par 127.0.0.1 (qui désignerait le conteneur du daemon) ni
      # par host.docker.internal (qui désignerait l'hôte). Écrasé ici plutôt
      # que laissé au .env : la valeur du .env est celle d'un lancement depuis
      # un terminal (http://127.0.0.1:3000), et les deux sont justes dans leur
      # contexte.
      OPENHANDS_URL: http://cds-openhands:3000
      # 127.0.0.1 (le défaut) n'écouterait que sur la boucle locale DU
      # CONTENEUR, donc /healthz serait injoignable même en publiant le port.
      # L'exposition reste bornée par le mapping ports: ci-dessous.
      HEALTH_HOST: 0.0.0.0
      PROJECTS_FILE: /app/projects.json
      STATE_FILE: /app/state/processed.jsonl

    volumes:
      # Configuration par dépôt, en lecture seule : le daemon la relit à chaud
      # à chaque cycle de polling, il n'a jamais à l'écrire.
      - ./projects.json:/app/projects.json:ro
      # Journal des demandes : doit survivre à `docker compose down`, c'est lui
      # qui évite de rejouer une demande déjà traitée. Le seul chemin dans
      # lequel ce conteneur écrit — d'où le USER node du Dockerfile.
      - ./state:/app/state

    networks:
      cds-agent-net:

    ports:
      # /healthz et /metrics, sur la boucle locale de l'hôte UNIQUEMENT.
      - "127.0.0.1:${HEALTH_PORT:-8090}:${HEALTH_PORT:-8090}"

networks:
  cds-agent-net:
    # Nom explicite, sans le préfixage de projet que compose appliquerait
    # autrement : c'est sous ce nom que docker/openhands/docker-compose.yml le
    # déclare `external`.
    name: cds-agent-net
